apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: books-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/theexeq/devops-kubernetes.git
    targetRevision: test
    path: helm/books-app
  destination:
    server: https://kubernetes.default.svc
    namespace: books-app
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
